<!doctype html>
<html lang="en">
<head>

<title>Blender course · Zedlab</title>
<meta name="description" content="A course companion for six weeks of Blender 5.2 LTS. Your own course, saved on your own device.">
<meta name="theme-color" content="#1D1D1B">

<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app/styles.css">
<script>
  /* Light or dark, before anything is drawn (the choice is saved on this device). */
  try { var saved = JSON.parse(localStorage.getItem("zedlabBlenderCourse.v1") || "null"); if (saved && saved.settings && saved.settings.theme === "light") document.documentElement.setAttribute("data-theme", "light"); } catch (e) {}
</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to the lesson</a>

<header class="topbar">

  </a>
  <span class="topbar-name" id="learner-name"></span>
</header>
