<script>
  /* Light or dark, before anything is drawn (the choice is saved on this device). */
  try {
    var saved = JSON.parse(localStorage.getItem("zedlabBlenderCourse.v1") || "null");
    if (saved && saved.settings && saved.settings.theme === "light") document.documentElement.setAttribute("data-theme", "light");
  } catch (e) { /* the dark look */ }
</script>
<style>
  /* The opening, every time the app opens: Pweza drops in (0.9 s, with a small bounce), "BLENDER COURSE"
     fades in, he blinks and waves, and a thin orange line fills. It stays until his wave has finished
     (about 1.8 s), even when the app is ready sooner, then fades out over 0.5 s. It is slower than the
     rest of the app on purpose, so you can see what it is: the one exception to the 320 to 450 ms rule.
     It is all here (SVG and CSS), so it shows at once, before anything else loads, and works offline.
     The app takes it away; if it ever cannot, it fades out by itself at 4 s.
     app/app.js also puts it back up as a cover while the app is in the background, and plays it again
     on coming back (Pweza is already standing there, so without the drop). */
  .pl { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: #000000;
    transition: opacity 500ms ease-in-out; animation: pl-away 500ms ease-in-out 4s forwards;
    --pz-body: #FFFFFF; --pz-ink: #000000; --pz-glass: #F08A24; }
  .pl.is-gone { opacity: 0; pointer-events: none; }
  .pl.is-gone.is-tapped { pointer-events: auto; } /* a tap that skips it never reaches the screen underneath */
  .pl-inner { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .pl-fig { width: 140px; height: 140px; animation: pl-drop 900ms cubic-bezier(0.3, 1.45, 0.55, 1) both; }
  .pl svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .pl svg g { transform-box: view-box; }
  .pl .pz-eyes { animation: pl-blink 200ms ease-in-out 1070ms both; }
  .pl-arm-still { display: none; }
  .pl-title { margin: 0; color: #FFFFFF; font: 700 13px/1 "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.08em; text-transform: uppercase; animation: pl-fade 450ms ease 670ms both; }
  .pl-line { width: 120px; height: 2px; border-radius: 2px; background: rgba(255, 255, 255, 0.14); overflow: hidden; }
  .pl-line i { display: block; height: 100%; background: #F08A24; transform-origin: left center; animation: pl-load 1.8s linear both; }
  /* The cover while the app is in the background: Pweza standing, the words, the line empty */
  .pl.is-rest, .pl.is-rest * { animation: none !important; }
  .pl.is-rest .pl-line i { transform: scaleX(0); }
  /* Coming back from another app: the same 1.8 s, with Pweza and the words already there */
  .pl.is-back, .pl.is-back .pl-fig, .pl.is-back .pl-title { animation: none; }
  @keyframes pl-drop { from { transform: translateY(-90px); opacity: 0; } 35% { opacity: 1; } to { transform: none; opacity: 1; } }
  @keyframes pl-blink { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.08); } }
  @keyframes pl-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes pl-load { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes pl-away { to { opacity: 0; visibility: hidden; } }
  /* Reduce motion: no drop, no blink, no wave. Pweza and the words show still for 1 s, then fade over 0.5 s.
     The line keeps the time, unseen. (app/styles.css shortens every animation with reduce motion;
     these keep the opening's time and its fade.) */
  @media (prefers-reduced-motion: reduce) {
    .pl-fig, .pl .pz-eyes, .pl-title { animation: none !important; }
    .pl-line { visibility: hidden; }
    .pl-arm-anim { display: none; } .pl-arm-still { display: inline; }
    .pl { transition-duration: 500ms !important; }
    .pl-line i { animation-duration: 1s !important; }
  }
</style>
